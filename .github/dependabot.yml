version: 2

updates:
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 5
    groups:
      dashboard-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      dashboard-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 5
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Etc/UTC
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 2
