name: Fuzz security boundaries

on:
  pull_request:
  schedule:
    - cron: "23 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-boundaries:
    name: Gateway boundary fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build fuzz target
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          keep-unaffected-fuzz-targets: true
      - name: Run fuzz target
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: ${{ github.event_name == 'schedule' && 'batch' || 'code-change' }}
          fuzz-seconds: ${{ github.event_name == 'schedule' && '900' || '180' }}
          minimize-crashes: true
          parallel-fuzzing: true
