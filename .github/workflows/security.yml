name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-policy:
    name: Immutable workflow dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require immutable Action revisions
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          failures = []
          workflow_dir = pathlib.Path(".github/workflows")
          paths = sorted((*workflow_dir.glob("*.yml"), *workflow_dir.glob("*.yaml")))
          for path in paths:
              for lineno, line in enumerate(path.read_text().splitlines(), 1):
                  match = re.search(r"\buses:\s*([^\s#]+)", line)
                  if not match:
                      continue
                  value = match.group(1)
                  if value.startswith("./"):
                      continue
                  revision = value.rpartition("@")[2]
                  if not re.fullmatch(r"[0-9a-f]{40}", revision):
                      failures.append(f"{path}:{lineno}: {value}")
          if failures:
              raise SystemExit("Actions must use full commit SHAs:\n" + "\n".join(failures))
          print("immutable-actions-ok")
          PY

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan repository history
        run: gitleaks git --redact --no-banner --exit-code 1

  dashboard-dependencies:
    name: Dashboard dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Reject known vulnerabilities
        working-directory: dashboard
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
