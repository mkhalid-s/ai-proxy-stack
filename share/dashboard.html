<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LeanRelay dashboard</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f2430;
      --border: #2c3340;
      --text: #e7eaf0;
      --muted: #8f98aa;
      --ok: #31c48d;
      --warn: #f6ad55;
      --fail: #f56565;
      --accent: #7aa2ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --panel-2: #f0f3f8;
        --border: #dfe4ee;
        --text: #18202f;
        --muted: #667085;
        --accent: #245cff;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--panel) 94%, transparent); }
    h1, p { margin: 0; }
    h1 { font-size: 17px; letter-spacing: -.02em; }
    .subtitle { color: var(--muted); font-size: 12px; }
    .window { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    select { border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); color: var(--text); font: inherit; padding: 5px 8px; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 36px; }
    .loading { margin: 0; color: var(--muted); }
    noscript { display: block; max-width: 760px; margin: 48px auto; padding: 16px; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); background: var(--panel); }
    @media (max-width: 560px) { header { align-items: flex-start; flex-direction: column; } main { padding: 18px 14px 28px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LeanRelay</h1>
      <p class="subtitle">Local token-efficiency overview</p>
    </div>
    <label class="window" for="window-select">Time window
      <select id="window-select" aria-label="Dashboard time window">
        <option value="1h">1h</option>
        <option value="6h">6h</option>
        <option value="24h">24h</option>
        <option value="7d">7d</option>
        <option value="30d">30d</option>
      </select>
    </label>
  </header>
  <main>
    <div id="svelte-overview"><p class="loading">Loading token-efficiency overview…</p></div>
    <noscript>This local dashboard needs JavaScript to render its token-efficiency metrics. Use <code>apx status</code>, <code>apx doctor</code>, and <code>apx logs</code> for command-line diagnostics.</noscript>
  </main>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
